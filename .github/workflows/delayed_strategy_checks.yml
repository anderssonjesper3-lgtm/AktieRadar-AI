name: Delayed strategy static checks
on:
  push:
    paths:
      - 'app.py'
      - 'requirements.txt'
      - 'runtime.txt'
      - 'multi_engine.py'
      - 'test_avanza_forbattrad.py'
      - 'aktieradar_telegram.py'
      - '.github/workflows/delayed_strategy_checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real app dependencies
        run: python -m pip install -r requirements.txt
      - name: Import and verify Avanza MCP integration
        run: |
          python - <<'PY'
          from avanza_mcp import mcp
          from fastmcp import Client
          from multi_engine import companies
          assert len(companies()) == 10
          print('Avanza MCP import OK; 10 companies configured')
          PY
      - name: Compile changed modules without installing Avanza
        run: python -m py_compile app.py multi_engine.py test_avanza_forbattrad.py aktieradar_telegram.py news_scanner.py
      - name: Check sparse trading candles
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from test_avanza_forbattrad import build_candles, calculate_relative_volume
          base = datetime(2026, 11, 23, 9, 0, tzinfo=timezone.utc).timestamp()*1000
          points = [{'timestamp': int(base + m*60000), 'open':100+m, 'high':101+m, 'low':99+m, 'close':100+m, 'totalVolumeTraded':10} for m in (0,2,5,9)]
          candles, gaps = build_candles(points)
          assert len(candles)==2 and len(gaps)==2
          assert [c['observed_minutes'] for c in candles]==[2,2]
          assert candles[0]['volume']==20 and candles[1]['volume']==20
          assert all(c['partial_observation'] for c in candles)
          print('Sparse-trading candle aggregation passed')
          PY
      - name: Check intended source and age gate
        run: |
          python - <<'PY'
          from pathlib import Path
          engine=Path('multi_engine.py').read_text()
          source=Path('test_avanza_forbattrad.py').read_text()
          app=Path('app.py').read_text()
          assert 'MAX_AGE_MINUTES = 20' in source
          assert 'fetch_points' in engine and 'build_candles' in engine
          assert 'NYHET-VAKTA' in engine and 'VAKTA-RISKGRANSKNING' in engine
          assert 'query1.finance.yahoo.com' not in app
          print('Delayed Avanza strategy static checks passed')
          PY
