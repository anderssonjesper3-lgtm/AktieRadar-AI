name: News radar monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: news-radar-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Capture workflow creation time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at) || created=''
          echo "RADAR_RUN_CREATED_AT=$created" >> "$GITHUB_ENV"
      - run: python news_monitor.py --live-check --send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Persist observations
        if: always()
        run: |
          if [ -f news_followup_state.json ]; then
            git config user.name "news-radar[bot]"
            git config user.email "news-radar@users.noreply.github.com"
            git add news_followup_state.json
            if [ -f news_seen.json ]; then git add news_seen.json; fi
            if [ -f news_latency.json ]; then git add news_latency.json; fi
            if ! git diff --cached --quiet; then
              git commit -m "Update news observation state"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
