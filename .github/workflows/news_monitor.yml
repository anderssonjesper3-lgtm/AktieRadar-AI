name: News radar monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-radar-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python news_monitor.py --live-check
      - name: Persist observations
        if: always()
        run: |
          if [ -f news_followup_state.json ]; then
            git config user.name "news-radar[bot]"
            git config user.email "news-radar@users.noreply.github.com"
            git add news_followup_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update news observation state"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
