name: AktieRadar AI - Saab Telegram

on:
  # Legacy workflow: manual-only backup, no scheduled duplicate alerts.
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = Telegram-test, dry-run = analys utan notis, live = riktiga signaler'
        required: true
        default: test
        type: choice
        options:
          - test
          - dry-run
          - live

permissions:
  contents: read
  actions: write

# Queue instead of canceling an in-flight notification after Telegram sends.
concurrency:
  group: aktieradar-saab-telegram
  cancel-in-progress: false

jobs:
  bevaka:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hamta koden
        uses: actions/checkout@v4
      - name: Installera Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installera beroenden
        run: python -m pip install fastmcp avanza-mcp
      - name: Analysera Saab och skicka eventuella notiser
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AKTIERADAR_COOLDOWN_MINUTES: '30'
          MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
        run: |
          if [ "$MODE" = 'test' ]; then
            python aktieradar_telegram.py --test
          elif [ "$MODE" = 'dry-run' ]; then
            python aktieradar_telegram.py --dry-run
          else
            python aktieradar_telegram.py
          fi
