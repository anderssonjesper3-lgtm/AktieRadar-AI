name: AktieRadar AI 6.0 - Official company news monitor

on:
  schedule:
    # GitHub cron is UTC. The scanner also enforces Swedish market hours.
    - cron: '*/5 7-16 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run reads sources only; live sends Telegram news alerts'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live

permissions:
  contents: read
  actions: write

concurrency:
  group: aktieradar6-official-news
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aktieradar-6.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan all official company sources
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
        run: |
          if [ "$MODE" = "live" ]; then
            python aktieradar_telegram.py --news-scan
          else
            python aktieradar_telegram.py --news-dry-run
          fi
