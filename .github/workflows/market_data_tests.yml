name: Market data adapter tests
on:
  push:
    paths:
      - 'market_data_adapter.py'
      - 'test_market_data_adapter.py'
      - 'avanza_stream_bridge.py'
      - 'test_avanza_stream_bridge.py'
      - '.github/workflows/market_data_tests.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_market_data_adapter test_avanza_stream_bridge
