name: AktieRadar AI 6.0 - News monitor

on:
  schedule:
    # Five-minute polling on weekdays; Nasdaq's official RSS page allows
    # considerably more frequent pulls for CNS. This is deliberately slower.
    - cron: '*/5 7-16 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = read feeds only; live = send Telegram news alerts'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live

permissions:
  contents: read
  actions: write

concurrency:
  group: aktieradar6-news-monitor
  cancel-in-progress: false

jobs:
  scan-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout 6.0
        uses: actions/checkout@v4
        with:
          ref: aktieradar-6.0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan official RSS feeds
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
        run: |
          if [ "$MODE" = 'live' ]; then
            python aktieradar_telegram.py --news-scan
          else
            python aktieradar_telegram.py --news-dry-run
          fi
