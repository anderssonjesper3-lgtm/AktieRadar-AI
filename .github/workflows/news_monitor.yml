name: News radar monitor
on:
  schedule:
    - cron: '0,15,30,45 * * * *'
    - cron: '5,20,35,50 * * * *'
    - cron: '10,25,40,55 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: news-radar-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check news
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = schedule ]; then
            python - <<'PY'
          import os
          from datetime import datetime, timezone, timedelta
          from news_monitor import scheduled_due
          from subprocess import check_call
          now = datetime.now(timezone.utc)
          slots = [int(x) for x in os.environ['CRON'].split()[0].split(',')]
          stamp = now.replace(second=0,microsecond=0)
          while stamp.minute not in slots:
              stamp -= timedelta(minutes=1)
          if scheduled_due(stamp):
              check_call(['python','news_monitor.py','--live-check'])
          PY
          else
            python news_monitor.py --live-check
          fi
