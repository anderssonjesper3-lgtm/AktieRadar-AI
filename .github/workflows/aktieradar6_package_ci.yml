name: AktieRadar AI 6.0 - Development CI and release gate

on:
  workflow_dispatch:
  push:
    branches:
      - aktieradar-6.0

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: aktieradar-6.0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m pytest -q
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Validate configuration and safe command entry points
        run: |
          python -m json.tool news_watchlist.json > /dev/null
          python multi_runner.py --help > /dev/null
          python verify_avanza.py --help > /dev/null
          python verify_sources.py --help > /dev/null
      - name: Audit production release blockers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("news_watchlist.json").read_text(encoding="utf-8"))
          companies = cfg.get("companies", [])
          required_files = ["performance.py"]
          missing_files = [p for p in required_files if not Path(p).is_file()]
          app = Path("app.py").read_text(encoding="utf-8")
          blockers = []
          if "AktieRadar AI 5.0" in app or "5.0 dashboard" in app:
              blockers.append("Dashboard in development branch is still labelled/versioned 5.0; complete and verify 6.0 UI before release.")
          if missing_files:
              blockers.append("Missing 6.0 performance/journal module(s): " + ", ".join(missing_files))
          if not companies or any(not c.get("feeds") for c in companies):
              blockers.append("One or more companies have no configured news feeds; news monitoring is not live for all watchlist shares.")
          if len(companies) != 10:
              blockers.append(f"Expected 10 watchlist companies; found {len(companies)}.")
          report = {
              "branch": "aktieradar-6.0",
              "automated_tests_passed": True,
              "company_count": len(companies),
              "configured_news_feed_count": sum(len(c.get("feeds", [])) for c in companies),
              "missing_required_files": missing_files,
              "production_ready": not blockers,
              "release_blockers": blockers,
              "live_market_data_confirmed": False,
              "telegram_live_delivery_confirmed": False,
              "note": "CI checks code and configuration only; production readiness requires live-session validation and operational secrets/notification checks."
          }
          Path("release_readiness.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Upload test and release-readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aktieradar6-development-ci-report
          path: release_readiness.json
          if-no-files-found: warn
