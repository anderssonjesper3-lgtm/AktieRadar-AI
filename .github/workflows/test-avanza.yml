name: Testa Avanza

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testa-avanza:
    runs-on: ubuntu-latest

    steps:
      - name: Hamta programkoden
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installera requests
        run: python -m pip install requests fastmcp avanza-mcp

      - name: Kor Avanza-testet
        run: python test_avanza.py
