name: AktieRadar 5.0 - Safe diagnostics
on:
  push:
    paths:
      - '.github/workflows/aktieradar_5_diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check all sources (no alerts)
        run: python verify_sources.py --health --news
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aktieradar-verification
          path: verification_report.json
