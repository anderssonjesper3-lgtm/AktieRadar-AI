name: AktieRadar AI 6.0 - Unified market monitor

on:
  schedule:
    # GitHub cron is UTC. The scanner also enforces Swedish market hours.
    - cron: '*/5 7-16 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run validates the unified engine; live records paper trades and sends alerts'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live

permissions:
  contents: write
  actions: write

concurrency:
  group: aktieradar6-unified-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aktieradar-6.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unified ten-stock scanner and journal
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AKTIERADAR_JOURNAL_REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
        run: |
          if [ "$MODE" = "live" ]; then
            python aktieradar_telegram.py --multi-live
          else
            python aktieradar_telegram.py --multi-dry-run
          fi
