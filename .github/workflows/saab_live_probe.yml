name: Saab B market data probe (read only)
on:
  push:
    paths:
      - 'saab_live_probe.py'
      - '.github/workflows/saab_live_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Probe Saab B public market endpoint
        run: python saab_live_probe.py
