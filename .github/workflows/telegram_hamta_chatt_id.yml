name: Hamta Telegram chatt-ID

on:
  workflow_dispatch:

jobs:
  find-chat:
    runs-on: ubuntu-latest
    steps:
      - name: Hamta chatt-ID utan att visa hemligheter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ.get('TELEGRAM_BOT_TOKEN')
          if not token:
              raise SystemExit('TELEGRAM_BOT_TOKEN saknas i GitHub Secrets.')
          url = 'https://api.telegram.org/bot' + token + '/getUpdates'
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  data = json.load(response)
          except Exception:
              raise SystemExit('Kunde inte hamta uppdateringar. Kontrollera botnyckeln.')
          if not data.get('ok'):
              raise SystemExit('Telegram nekade anropet. Kontrollera botnyckeln.')
          ids = sorted({str(update['message']['chat']['id'])
                        for update in data.get('result', [])
                        if update.get('message', {}).get('chat', {}).get('type') == 'private'})
          if not ids:
              print('Inga privata chattar hittades. Skicka hej till din bot och kor igen.')
          else:
              for chat_id in ids:
                  print('CHAT_ID: ' + chat_id)
              print('Spara ditt CHAT_ID som TELEGRAM_CHAT_ID i GitHub Secrets.')
          PY
