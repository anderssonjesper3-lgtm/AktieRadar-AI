name: AktieRadar AI 6.0 - Saab signal alerts

on:
  # Legacy workflow: manual-only backup, no scheduled duplicate alerts.
  workflow_dispatch:
    inputs:
      mode:
        description: 'test, dry-run eller live'
        required: true
        default: dry-run
        type: choice
        options:
          - test
          - dry-run
          - live

permissions:
  contents: read
  actions: write

concurrency:
  group: aktieradar6-saab-signals
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aktieradar-6.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Saab signal monitor
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AKTIERADAR_COOLDOWN_MINUTES: '30'
          MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
        run: |
          if [ "$MODE" = "test" ]; then
            python aktieradar_telegram.py --test
          elif [ "$MODE" = "dry-run" ]; then
            python aktieradar_telegram.py --dry-run
          else
            python aktieradar_telegram.py
          fi
