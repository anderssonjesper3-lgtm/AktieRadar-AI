name: AktieRadar AI 6.0 - Package CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'AktieRadar_AI_6_0_LAYOUT_AND_CI_UPDATE_2026-11-22_v3.zip'

permissions:
  contents: read

jobs:
  package-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout 6.0 development branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack complete 6.0 package into workspace
        run: |
          set -euo pipefail
          test -f AktieRadar_AI_6_0_LAYOUT_AND_CI_UPDATE_2026-11-22_v3.zip
          mkdir -p .ar6-package
          unzip -q AktieRadar_AI_6_0_LAYOUT_AND_CI_UPDATE_2026-11-22_v3.zip -d .ar6-package
          test -d .ar6-package/AktieRadar-AI-6.0
          cp -a .ar6-package/AktieRadar-AI-6.0/. .
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline test suite
        run: python -m pytest -q
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Validate workflow YAML syntax
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.github/workflows').glob('*.yml'):
              with path.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          print('All workflow YAML files parsed successfully.')
          PY
