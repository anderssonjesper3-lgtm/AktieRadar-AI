name: Saab B public quote verification
on:
  push:
    paths:
      - 'verify_public_saab_quote.py'
      - '.github/workflows/verify_public_saab_quote.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python verify_public_saab_quote.py
